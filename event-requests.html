<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./src/css/output.css">
        <script src="index.js"></script>
        <title>EventHive</title>
    </head>
<body>
    <div class="container p-5">
        <h1 class="py-3 text-bold text-xl">Event Approval</h1>
        <ul class="max-w-md divide-y divide-gray-200 ">
            <li class="pb-3 sm:pb-4">
               <div class="flex items-center space-x-4 ">
                  <div class="flex-shrink-0">
                     <img class="w-8 h-8 rounded-full" src="src/images/university.png" alt="Neil image">
                  </div>
                  <div class="flex-1 min-w-0">
                     <p class="text-sm font-medium text-gray-900 truncate">
                        WebDev collab event
                     </p>
                     <p class="text-sm text-gray-500 truncate ">
                        20 December 2024
                     </p>
                  </div>
                  <div class="inline-flex items-center text-base font-semibold text-gray-900">
                    <p class="text-lg font-bold text-blue-600 cursor-pointer">Approve</p>
                  </div>
               </div>
            </li>
            <li class="py-3 sm:py-4">
               <div class="flex items-center space-x-4">
                  <div class="flex-shrink-0">
                     <img class="w-8 h-8 rounded-full" src="src/images/university.png" alt="Neil image">
                  </div>
                  <div class="flex-1 min-w-0">
                     <p class="text-sm font-medium text-gray-900 truncate ">
                        WebDev Event 2
                     </p>
                     <p class="text-sm text-gray-500 truncate ">
                        20 December 2024
                     </p>
                  </div>
                  <div class="inline-flex items-center text-base font-semibold text-gray-900 ">
                     <p class="text-lg font-bold text-blue-600 cursor-pointer">Approve</p>
                  </div>
               </div>
            </li>
        </ul>
    </div>
</body>
</html>
